<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel tournament leaderboard</title>
    <link rel="stylesheet" href="padel-leaderboard.css" />
    <script src="padel-leaderboard.js" defer></script>
  </head>
  <body>
    <h1>L'HOSPITALET PADEL RANKING</h1>
    <h2>RANKING</h2>
    <ol>
      <li>Gianni</li>
      <li>Mattia</li>
      <li>Dongjoo</li>
    </ol>
    <h2>MATCHES</h2>
    <input id="match-date" type="date" />
    <div class="match-players">
      <select id="player-1">
        <option value="">--Please choose a player--</option>
        <option value="Gianni">Gianni</option>
        <option value="Dongjoo">Dongjoo</option>
        <option value="Mattia">Mattia</option>
      </select>
      <select id="player-2">
        <option value="">--Please choose a player--</option>
        <option value="Gianni">Gianni</option>
        <option value="Dongjoo">Dongjoo</option>
        <option value="Mattia">Mattia</option>
      </select>
    </div>
    <div class="match-score">
      <input id="score-1" type="number" />
      <input id="score-2" type="number" />
    </div>
    <button id="add-match">Add match</button>
    <div id="match-info"></div>
  </body>
</html>
