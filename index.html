<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel tournament leaderboard</title>
    <link rel="stylesheet" href="padel-leaderboard.css" />
    <script src="padel-leaderboard.js" defer></script>
  </head>
  <body>
    <h1>L'HOSPITALET PADEL RANKING</h1>
    <h2>RANKING</h2>
    <ol>
      <li>Gianni</li>
      <li>Mattia</li>
      <li>Dongjoo</li>
    </ol>
    <h2>MATCHES</h2>
    <div class="match-display" id="match-card">
      <div class="date-time">
        <input type="date" />
        <input type="time" />
      </div>
      <h3>Match 1</h3>
      <div class="match-players">
        <select>
          <option value="">--Please choosel a player--</option>
          <option value="Gianni">Gianni</option>
          <option value="Dongjoo">Dongjoo</option>
          <option value="Mattia">Mattia</option>
        </select>
        <select>
          <option value="">--Please choosel a player--</option>
          <option value="Gianni">Gianni</option>
          <option value="Dongjoo">Dongjoo</option>
          <option value="Mattia">Mattia</option>
        </select>
      </div>
      <button id="create-set-btn">Create Set</button>
      <div id="match-sets"></div>
      <button id="generate-match-btn">Generate Match</button>
    </div>
    <button id="add-match-btn">Add match</button>
    <div id="match-info"></div>
  </body>
</html>
